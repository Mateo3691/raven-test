<main class="container-fluid h-100 d-flex justify-content-center align-items-center bg-light">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card login-card shadow-lg p-4">
          <h2 class="text-center mb-4 text-muted fst-italic">Inicie sesión</h2>
          <form [formGroup]="loginForm!">
            <div class="mb-3">
              <label for="username" class="form-label fst-italic">Usuario</label>
              <input id="username" type="text" class="form-control" formControlName="username">
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fst-italic">Contraseña</label>
              <input id="password" type="password" class="form-control" formControlName="password">
            </div>
            <div class="d-flex justify-content-center align-items-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <button type="submit" class="btn btn-primary w-100" [disabled]="false">Ingresar</button>
                </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
