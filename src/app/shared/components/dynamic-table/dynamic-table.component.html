<div class="card">
    <p-table responsiveLayout="scroll" [value]="data" (sortFunction)="customSort($event)" [customSort]="true">
        <ng-template pTemplate="header">
            <tr>
                <ng-container *ngFor="let column of columns">
                    <th class="text-center" pSortableColumn="{{column.key}}">{{column.description}} <p-sortIcon field="{{column.key}}"></p-sortIcon></th>
                </ng-container>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr (click)="onRowSelect(product)">
                <ng-container *ngFor="let column of columns">
                    <td class="text-center">{{product[column.key]}}</td>
                </ng-container>
            </tr>
        </ng-template>
    </p-table>
</div>
