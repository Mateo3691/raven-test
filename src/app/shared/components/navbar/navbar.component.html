<nav class="d-flex buttons-section justify-content-between align-items-center p-3">
    <div class="ml-5 text-muted fst-italic">
        <ng-container *ngIf="isUserLogged; else unlogedUserText">
            <h3>
                Bienvenido de nuevo! {{userName}}
            </h3>
        </ng-container>
        <ng-template #unlogedUserText>
            <h3>Bienvenido! Por favor inicie sesión</h3>
        </ng-template>
    </div>
    <div class="d-flex">
        <button (click)="changeTheme()" pButton pRipple type="button" styleClass="p-button-lg" icon="pi {{iconThemeName}}" class="p-button-rounded p-button-secondary"></button>
        <button *ngIf="isUserLogged" (click)="terminarSesion()" pButton pRipple type="button" styleClass="p-button-lg" icon="pi pi-sign-out" class="p-button-rounded p-button-secondary"></button>
    </div>
</nav>
